services:
  - type: web
    name: tunneling-platform
    runtime: docker
    repo: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: TUNNEL_DB_URL
        value: sqlite:////data/tunneling.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
